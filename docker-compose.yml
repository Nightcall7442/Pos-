services:
  # PostgreSQL 16 — образ на Debian, как у Railway: с локалью en_US.UTF-8
  # поиск без учёта регистра складывает кириллицу. На -alpine (musl) ICU-локали
  # ведут себя иначе. Локально: `docker compose up -d --wait postgres`.
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=qwik
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qwik}
      - POSTGRES_DB=qwik
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
      - TZ=UTC
      - PGTZ=UTC
    ports:
      # Только на localhost: база не должна торчать в сеть.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwik -d qwik"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # TimeZone=UTC: Prisma хранит время в UTC без пояса, и значения по
      # умолчанию из базы (CURRENT_TIMESTAMP) должны считаться в том же поясе.
      - DATABASE_URL=postgresql://qwik:${POSTGRES_PASSWORD:-qwik}@postgres:5432/qwik?schema=public&connection_limit=10&pool_timeout=20&options=-c%20TimeZone%3DUTC
      # Секреты должны различаться — иначе сервер не стартует (config/env.ts).
      - JWT_SECRET=${JWT_SECRET:-change-me-access-secret-0123456789}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-refresh-secret-0123456789}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost
      - PENDING_ORDER_TTL_MINUTES=30
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - PORT=80
      - BACKEND_URL=backend:3000
    depends_on:
      - backend
    restart: unless-stopped

  pos-terminal:
    build:
      context: ./pos-terminal
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - PORT=80
      - BACKEND_URL=backend:3000
    depends_on:
      - backend
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      - PORT=80
      - ADMIN_URL=http://localhost
      - POS_URL=http://localhost:8080
      - CONTACT_EMAIL=hello@example.com
    restart: unless-stopped

volumes:
  postgres-data:
  backend-uploads:
